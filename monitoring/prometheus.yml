global:
  # Prometheus requests /metrics every five seconds.
  scrape_interval: 5s

scrape_configs:
  - job_name: "limit-order-book-api"

    static_configs:
      # Prometheus runs inside Docker while the Rust API runs on the host.
      # Metrics have their own listener (METRICS_ADDR), separate from the API.
      - targets:
          - "host.docker.internal:9100"